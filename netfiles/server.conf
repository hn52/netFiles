# FTP/WebDAV服务器配置文件
# 注意：命令行参数优先于配置文件

[server]
bind_address = 0.0.0.0
ftp_port = 21
webdav_port = 8080
root_directory = /var/ftpd/root
io_threads = 4

[security]
# 用户文件路径
user_config = /etc/ftpd/users.conf
# 是否启用TLS
use_tls = false
# TLS证书和密钥
cert_file = /etc/ftpd/server.crt
key_file = /etc/ftpd/server.key

[logging]
# 日志级别: debug, info, warn, error
level = info
# 日志文件
log_file = /var/log/ftpd/ftpd.log
